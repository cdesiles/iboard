<!-- @dsCard group="Screens" height=560 page subtitle="Holding ⌘ on the board: every key of the screen on one card, two balanced columns" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shortcuts</title></head>
<body>
<div class="ib-screen" style="position:relative;height:520px;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box">
  <div class="ib-modal" style="width:600px;max-width:100%;box-sizing:border-box;padding:24px;display:block">
    <div class="ib-row" style="justify-content:space-between;flex-wrap:nowrap">
      <span style="font:500 13px/18px var(--font-sans);color:var(--ink)">Keyboard shortcuts</span>
      <span class="ib-cap">Release ⌘ to hide</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:16px">
      <div>
        <div class="ib-cap" style="font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase">Anywhere</div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘N</span><span class="ib-cap">New issue</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘,</span><span class="ib-cap">Settings</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">esc</span><span class="ib-cap">Clear</span></div>
        <div class="ib-cap" style="font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;margin-top:20px">Cards</div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">↑ ↓ ← →</span><span class="ib-cap">Move</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">↩</span><span class="ib-cap">Open</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">E</span><span class="ib-cap">Edit</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">L</span><span class="ib-cap">Labels</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘↩</span><span class="ib-cap">Next column</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">Del</span><span class="ib-cap">Delete</span></div>
      </div>
      <div>
        <div class="ib-cap" style="font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase">Board</div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘F</span><span class="ib-cap">Filter</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘R</span><span class="ib-cap">Refresh</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘I</span><span class="ib-cap">Stats</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌃⇥</span><span class="ib-cap">Next project</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘Z</span><span class="ib-cap">Undo</span></div>
        <div class="ib-cap" style="font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;margin-top:20px">Agent</div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘⇧R</span><span class="ib-cap">Review</span></div>
        <div class="ib-row" style="height:20px;gap:4px;flex-wrap:nowrap"><span class="ib-kbd">⌘K</span><span class="ib-cap">Ask</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
