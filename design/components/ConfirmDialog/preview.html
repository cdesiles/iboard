<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConfirmDialog</title></head>
<body>
<div class="ib-scrim" style="min-height:300px">
<section class="ib-confirm" role="alertdialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
<h2 class="ib-confirm__title" id="t">Delete this issue?</h2>
<div class="ib-confirm__subject"><b>Sidebar collapse toggle</b><span>done/sidebar-collapse-toggle.md</span></div>
<p class="ib-confirm__body" id="d">The file is moved to the macOS Trash. You can restore it from there.</p>
<div class="ib-confirm__foot"><button class="ib-btn">Cancel <span class="ib-btn__key">esc</span></button><button class="ib-btn ib-btn--danger is-focus"><svg class="ib-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.4 7V4.9a.9.9 0 0 1 .9-.9h3.4a.9.9 0 0 1 .9.9V7"/><path d="M6.25 7l.65 14h10.2l.65-14"/><path d="M10 9.6v8.3M14 9.6v8.3"/></svg>Delete <span class="ib-btn__key">↩</span></button></div>
</section></div>
</body>
</html>
