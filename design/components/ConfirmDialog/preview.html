<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConfirmDialog</title></head>
<body>
<div class="ib-scrim" style="min-height:300px">
<section class="ib-confirm" role="alertdialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
<h2 class="ib-confirm__title" id="t">Delete this issue?</h2>
<div class="ib-confirm__subject"><b>Sidebar collapse toggle</b><span>done/sidebar-collapse-toggle.md</span></div>
<p class="ib-confirm__body" id="d">The file is moved to the macOS Trash. You can restore it from there.</p>
<div class="ib-confirm__foot"><button class="ib-btn">Cancel <span class="ib-cap" style="color:inherit">esc</span></button><button class="ib-btn ib-btn--danger is-focus"><svg class="ib-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7a2.5 2.5 0 0 1 5 0"/><path d="M6.5 7l.9 11.1a3 3 0 0 0 3 2.9h3.2a3 3 0 0 0 3-2.9L17.5 7"/><path d="M10 11v5.5M14 11v5.5"/></svg>Delete <span class="ib-cap" style="color:inherit">↩</span></button></div>
</section></div>
</body>
</html>
