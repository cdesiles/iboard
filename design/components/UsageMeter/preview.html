.um-stage .ib-statusbar{position:absolute;left:0;right:0;bottom:0}
.um-stage .ib-usage{position:absolute;right:var(--space-5);bottom:calc(var(--statusbar-h) + var(--space-2))}
.um-path{overflow:hidden;text-overflow:ellipsis}
.um-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-4)}
