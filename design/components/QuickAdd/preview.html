<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>QuickAdd</title></head>
<body>
<div class="rv-pad" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start">
<div class="rv-stack"><span class="rv-cap">Typing</span>
<div class="rv-composer"><input aria-label="New ticket title" placeholder="Ticket title" value="Export board as markdown"><div class="rv-composer__meta"><span>todo/export-board-as-markdown.md</span><span class="rv-hints"><span><span class="rv-kbd">↩</span> add</span><span><span class="rv-kbd">⌘↩</span> edit</span></span></div></div>
<span class="rv-cap" style="margin-top:8px">Name already taken</span>
<div class="rv-composer"><input aria-label="New ticket title, name taken" placeholder="Ticket title" value="Inline ticket editing"><div class="rv-composer__meta"><span class="rv-warn">todo/inline-ticket-editing-2.md</span><span class="rv-hints"><span><span class="rv-kbd">↩</span> add</span></span></div></div>
</div>
<div class="rv-stack"><span class="rv-cap">After ↩: cleared, new card below</span>
<div class="rv-composer"><input aria-label="New ticket title, empty" placeholder="Ticket title"><div class="rv-composer__meta"><span>todo/</span><span class="rv-hints"><span><span class="rv-kbd">esc</span> close</span></span></div></div>
<article class="rv-card is-new"><div class="rv-card__title">Export board as markdown</div><div class="rv-card__meta">export-board-as-markdown.md</div></article>
</div>
</div>
</body>
</html>
