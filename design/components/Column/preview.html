<!-- @dsCard group="Board" height=230 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Column</title></head>
<body>
<div class="ib-board" style="grid-template-columns:repeat(4,minmax(0,1fr))">
<section class="ib-col is-todo"><header class="ib-col__head"><span class="ib-dot"></span><span class="ib-col__title">Todo</span><span class="ib-col__count">1</span><button class="ib-btn ib-btn--ghost ib-btn--icon ib-col__add" aria-label="New issue in Todo (⌘N)"><svg class="ib-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header><article class="ib-card"><div class="ib-labels"><button class="ib-lbl" title="Filter by discovery">discovery</button></div><div class="ib-card__title">AI assist to refine an issue</div><div class="ib-card__summary">Challenge an issue before anyone picks it up.</div></article></section>
<section class="ib-col is-ready"><header class="ib-col__head"><span class="ib-dot"></span><span class="ib-col__title">Ready</span><span class="ib-col__count">1</span></header><article class="ib-card"><div class="ib-labels"><button class="ib-lbl" title="Filter by design">design</button></div><div class="ib-card__title">Make the accent colour green</div><div class="ib-card__summary">Refined and queued: first in line for an agent.</div><div class="ib-card__meta">001-make-accent-green.md</div></article></section>
<section class="ib-col is-doing"><header class="ib-col__head"><span class="ib-dot"></span><span class="ib-col__title">Doing</span><span class="ib-col__count">0</span></header><div class="ib-empty">No issues in doing/</div></section>
<section class="ib-col is-done"><header class="ib-col__head"><span class="ib-dot"></span><span class="ib-col__title">Done</span><span class="ib-col__count">3</span></header><article class="ib-card"><div class="ib-labels"><button class="ib-lbl" title="Filter by feature">feature</button></div><div class="ib-card__title">Board and markdown reader</div><div class="ib-card__summary">A kanban board of all issues, and a reader.</div></article></section>
</div>
</body>
</html>
