<!-- @dsCard group="Foundations" height=560 subtitle="The line set, and the new soft trash in light and dark" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icons</title>
<style>
.ix-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:0}
.ix-pane{background:var(--bg);color:var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px}
.ix-set{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ix-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);color:var(--ink-muted);font:var(--text-meta)}
.ix-tile .ib-ico{width:18px;height:18px;color:var(--ink)}
.ix-tile.is-new{border-color:var(--danger);color:var(--danger)}
.ix-tile.is-new .ib-ico{color:var(--danger)}
.ix-cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ix-spec{display:flex;flex-direction:column;align-items:center;gap:6px;font:var(--text-meta);color:var(--ink-muted);text-align:center}
.ix-spec svg{width:96px;height:96px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
.ix-grid{fill:none;stroke:var(--line);stroke-width:.15}
.ix-glyph{fill:none;stroke:var(--ink-faint);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ix-spec.is-after .ix-glyph{stroke:var(--ink)}
.ix-spec.is-after span{color:var(--ink)}
.ix-use{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ix-pane .ib-zone{max-width:none}
</style></head>
