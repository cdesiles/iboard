[package]
name = "iboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Fast, local kanban board and markdown reader for issues/ directories"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "iboard"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "idesign"
path = "src/bin/idesign.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_commonmark", "dep:egui_extras", "dep:image", "dep:objc2-app-kit", "dep:block2", "dep:two-face", "dep:syntect"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
egui_commonmark = { version = "0.25.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
egui_extras = { version = "0.36.2", optional = true, default-features = false, features = ["image", "file", "syntect"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "tiff"] }
toml_edit = "0.25.15"
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-themes"] }
# Syntect grammars its default set lacks (TypeScript, Swift, TOML…), for diffs.
two-face = { version = "0.5.2", optional = true, default-features = false, features = ["syntect-default-fancy"] }

[lints.clippy]
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", optional = true }
objc2-foundation = "0.3.2"

[dev-dependencies]
egui_kittest = "0.36.2"
insta = "1"
tempfile = "3.27"
