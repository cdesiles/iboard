[package]
name = "iboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Fast, local kanban board and markdown reader for issues/ directories"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "iboard"
path = "src/main.rs"

[[bin]]
name = "idesign"
path = "src/bin/idesign.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36.2"
egui = "0.36.2"
egui_commonmark = "0.25.0"
egui_extras = { version = "0.36.2", default-features = false, features = ["image", "file"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
image = { version = "0.25", default-features = false, features = ["png"] }
toml_edit = "0.25.15"

[lints.clippy]
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
egui_kittest = "0.36.2"
insta = "1"
tempfile = "3.27"
