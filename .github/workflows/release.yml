name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, already pushed
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin

jobs:
  release:
    name: Build and attach iboard.app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check the runner is Apple silicon
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::$TARGET needs an arm64 runner"
            exit 1
          fi

      - name: Check the tag names the Cargo.toml version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ "$TAG" != "v$version" ] || ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$declared" ]; then
            echo "::error::$TAG differs from the Cargo.toml version $declared"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build iboard.app
        run: make app

      - name: Zip the bundle
        run: ditto -c -k --keepParent target/iboard.app "iboard-$VERSION-$TARGET.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          asset="iboard-$VERSION-$TARGET.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --generate-notes --title "iboard $TAG"
          fi
