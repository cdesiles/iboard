name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, already pushed
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and attach iboard.app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Name this build after its tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;;
          esac
          perl -pi -e "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          grep -q "^version = \"$version\"$" Cargo.toml

      - name: Build iboard.app
        run: make app

      - name: Zip the bundle
        run: ditto -c -k --keepParent target/iboard.app iboard.app.zip

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iboard.app.zip --clobber
          else
            gh release create "$TAG" iboard.app.zip --generate-notes --title "iboard $TAG"
          fi
